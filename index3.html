<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Caregiver Application | Detroit Senior Services</title>
  <style>
    /* ---------- GLOBAL RESET & BASE ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f8f9fc;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      color: #1e2b3c;
      line-height: 1.5;
      font-size: 18px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ---------- MAIN CARD ---------- */
    .main-card {
      max-width: 1000px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 8px 20px rgba(0, 0, 0, 0.03);
      display: flex;
      overflow: hidden;
      border: 1px solid #e9edf4;
    }

    /* ---------- LEFT PANEL ---------- */
    .left-panel {
      width: 34%;
      min-width: 260px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 2;
      overflow: hidden;
    }

    /* Logo block at top with 30px margins */
    .left-panel .brand-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 30px;
      background: #ffffff;
      position: relative;
      z-index: 3;
    }

    .left-panel .brand-logo {
      display: block;
      width: min(100%, 260px);
      height: auto;
      max-height: 130px;
      object-fit: contain;
      border-radius: 8px;
    }

    /* Blue curved panel */
    .left-panel .blue-panel {
      background-color: #3b7cbf;
      color: #ffffff;
      flex: 1;
      padding: 2rem 1.75rem 6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      border-top-left-radius: 80px 60px;
      border-top-right-radius: 80px 60px;
      border-bottom-right-radius: 100px 200px;
      position: relative;
      z-index: 2;
      margin-top: 1rem;
    }

    /* Headline inside blue area */
    .left-panel .pay-block {
      margin: 0 0 1.5rem;
      text-align: center;
    }

    .left-panel .pay-label {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.3;
      margin-bottom: 0.75rem;
    }

    .left-panel .pay-amount {
      font-size: 2.5rem;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.5px;
      color: #39d353;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      white-space: nowrap;
    }

    .left-panel .left-bottom-text {
      font-size: 1.1rem;
      line-height: 1.4;
      font-weight: 600;
      color: #ffffff;
      opacity: 0.95;
      max-width: 240px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      padding-top: 1.5rem;
      margin-top: 1.5rem;
    }

    /* ---------- RIGHT PANEL ---------- */
    .right-panel {
      flex: 1;
      padding: 2.5rem 2.5rem 2.5rem 1.5rem;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
     
    }

    .right-panel h1 {
      font-size: 2.3rem;
      font-weight: 800;
      color: #112233;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .right-panel .subtitle {
      font-size: 1.15rem;
      color: #4b5e71;
      margin-bottom: 1.5rem;
      font-weight: 400;
      line-height: 1.4;
    }

    /* ---------- FORM (from index2) ---------- */
    .form-section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #888;
      letter-spacing: 1px;
      margin-bottom: 10px;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
    }
.consent-heading{
      margin-top: 65px;
    }


.form-section-title h3{
    margin-top: 55px;
}
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 25px;
      margin-bottom: 25px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group select {
      padding: 14px 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      color: #333;
      background-color: #f9f9f9;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      width: 100%;
      font-family: inherit;
    }

    .form-group input::placeholder {
      color: #999;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #3b7cbf;
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(59, 124, 191, 0.1);
    }

    .form-group input[readonly] {
      background-color: #eef2f5;
      color: #666;
      cursor: not-allowed;
      border-color: #ddd;
    }

    /* Button – same as index1 */
    .btn-submit {
      font-size: 1.3rem;
      font-weight: 600;
      padding: 1rem 2rem;
      border-radius: 50px;
      border: none;
      background-color: #3b7cbf;
      color: #ffffff;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 10px rgba(59, 124, 191, 0.2);
      letter-spacing: 0.3px;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 0.5rem;
      text-decoration: none;
    }

    .btn-submit:hover {
      background-color: #2b5f94;
      box-shadow: 0 6px 14px rgba(43, 95, 148, 0.3);
    }

    .btn-submit:focus-visible {
      outline: 4px solid #1e2b3c;
      outline-offset: 4px;
    }

    .hidden {
      display: none !important;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 820px) {
      .main-card {
        flex-direction: column;
        border-radius: 28px;
        max-width: 700px;
      }

      .left-panel {
        width: 100%;
        min-width: unset;
      }

      .left-panel .brand-block {
        padding: 30px;
      }

      .left-panel .brand-logo {
        width: min(100%, 300px);
        max-height: 120px;
      }

      .left-panel .blue-panel {
        border-top-left-radius: 60px 40px;
        border-top-right-radius: 60px 40px;
        border-bottom-right-radius: 80px 60%;
        border-bottom-left-radius: 80px 60%;
        padding: 2rem 1.5rem 3rem;
        flex: none;
        margin-top: 0;
      }

      .left-panel .left-bottom-text {
        border-top: none;
        padding-top: 0.5rem;
        font-size: 1rem;
        max-width: 100%;
      }

      .right-panel {
        padding: 2rem 1.5rem 2rem;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .form-group.full-width {
        grid-column: span 1;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0.75rem;
      }

      .main-card {
        border-radius: 24px;
      }

      .left-panel .brand-block {
        padding: 20px;
      }

      .left-panel .brand-logo {
        width: min(100%, 240px);
        max-height: 100px;
      }

      .left-panel .blue-panel {
        padding: 1.5rem 1rem 2.5rem;
        border-top-left-radius: 40px 30px;
        border-top-right-radius: 40px 30px;
        border-bottom-right-radius: 60px 40%;
        border-bottom-left-radius: 60px 40%;
      }

      .left-panel .pay-amount {
        font-size: 2.15rem;
      }

      .right-panel {
        padding: 1.5rem 1rem 1.75rem;
      }

      .right-panel h1 {
        font-size: 1.9rem;
      }

      .right-panel .subtitle {
        font-size: 1.05rem;
      }

      .btn-submit {
        font-size: 1.2rem;
        padding: 0.9rem 1.5rem;
        min-height: 60px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="main-card" id="mainCard">

    <!-- LEFT PANEL -->
    <div class="left-panel">

      <!-- Logo at top on white background with 30px margin -->
      <div class="brand-block">
        <img
          class="brand-logo"
          src="images\ChatGPT Image Oct 7, 2026, 01_00_04 PM.png"
          alt="Family Caregiver Staffing logo"
        >
      </div>

      <!-- Blue curved panel starts right under the logo -->
      <div class="blue-panel">
        <div class="pay-block">
          <div class="pay-label"><h2>Clients Information</h2></div>
         
        </div>

        <div class="left-bottom-text">
          We recruit the people<br>who are already providing<br>the care.
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel" id="rightPanel">

      <h2>Become a Paid Family Caregiver</h2>
      <p class="subtitle">Already caring for a loved one?</p>

      <form id="clientInfoForm">
         <h3>Enter your client’s information below</h3>

        <div class="form-section-title" style="margin-top: 1.5rem;">Client's Information</div>

        <div class="form-grid">
          <!-- First Name -->
          <div class="form-group">
            <label for="clientFirstName">First Name</label>
            <input type="text" id="clientFirstName" name="clientFirstName" placeholder="Enter first name" required>
          </div>

          <!-- Last Name -->
          <div class="form-group">
            <label for="clientLastName">Last Name</label>
            <input type="text" id="clientLastName" name="clientLastName" placeholder="Enter last name" required>
          </div>

          <!-- Phone Number -->
          <div class="form-group">
            <label for="clientPhone">Phone #</label>
            <input type="tel" id="clientPhone" name="clientPhone" placeholder="(555) 000-0000" required>
          </div>

          <!-- Date of Birth -->
          <div class="form-group">
            <label for="clientDOB">Date of Birth</label>
            <input type="date" id="clientDOB" name="clientDOB" required>
          </div>

          <!-- Address (Full Width) -->
          <div class="form-group full-width">
            <label for="clientAddress">Address</label>
            <input type="text" id="clientAddress" name="clientAddress" placeholder="Street Address" required>
          </div>

          <!-- City -->
          <div class="form-group">
            <label for="clientCity">City</label>
            <input type="text" id="clientCity" name="clientCity" placeholder="City" required>
          </div>

          <!-- Zip Code -->
          <div class="form-group">
            <label for="clientZip">Zip Code</label>
            <input type="text" id="clientZip" name="clientZip" placeholder="Zip Code" required>
          </div>

          <!-- County -->
          <div class="form-group">
            <label for="clientCounty">County</label>
            <input type="text" id="clientCounty" name="clientCounty" placeholder="County" required>
          </div>

          <!-- State (Pre-filled Michigan) -->
          <div class="form-group">
            <label for="clientState">State</label>
            <input type="text" id="clientState" name="clientState" value="Michigan" readonly>
          </div>
        </div>

        <div class="form-section-title" style="margin-top: 15px;">Insurance Details</div>

        <div class="form-grid">
          <!-- Insurance Plan -->
          <div class="form-group">
            <label for="insurancePlan">What Insurance Plan does your mother have?</label>
            <select id="insurancePlan" name="insurancePlan" required>
              <option value="" disabled>Select an option</option>
              <option value="medicare">Medicare</option>
              <option value="medicaid">Medicaid</option>
              <option value="medicare-medicaid">Medicare and Medicaid</option>
              <option value="molina">Molina</option>
              <option value="wellcare-meridian">WellCare by Meridian</option>
              <option value="humana" selected>Humana</option>
              <option value="priority-health">Priority Health</option>
              <option value="amerihealth">AmeriHealth</option>
              <option value="aetna">Aetna</option>
              <option value="blue-cross-complete">Blue Cross Complete</option>
              <option value="united-health">United Health</option>
              <option value="hap-caresource">HAP CareSource</option>
              <option value="zing">Zing</option>
              <option value="private-pay">Private Pay</option>
            </select>
          </div>

          <!-- Insurance Member ID -->
          <div class="form-group">
            <label for="memberId">Insurance Member ID #</label>
            <input type="text" id="memberId" name="memberId" placeholder="Enter Member ID" required>
          </div>
        </div>

        <!-- Submit Button -->
        <a href="index4.html" class="btn-submit">Next &rarr;</a>
      </form>

    </div><!-- /right-panel -->
  </div><!-- /main-card -->

</body>
</html>
