<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Caregiver Application | Detroit Senior Services</title>
  <style>
    /* ---------- GLOBAL RESET & BASE ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f8f9fc;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      color: #1e2b3c;
      line-height: 1.5;
      font-size: 18px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ---------- MAIN CARD ---------- */
    .main-card {
      max-width: 1000px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 8px 20px rgba(0, 0, 0, 0.03);
      display: flex;
      overflow: hidden;
      border: 1px solid #e9edf4;
      min-height: 700px;
    }

    /* ---------- LEFT PANEL ---------- */
    .left-panel {
      width: 34%;
      min-width: 260px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 2;
      overflow: hidden;
    }

    /* Logo block at top with 30px margins */
    .left-panel .brand-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 30px;
      background: #ffffff;
      position: relative;
      z-index: 3;
    }

    .left-panel .brand-logo {
      display: block;
      width: min(100%, 260px);
      height: auto;
      max-height: 130px;
      object-fit: contain;
      border-radius: 8px;
    }

    /* Blue curved panel */
    .left-panel .blue-panel {
      background-color: #3b7cbf;
      color: #ffffff;
      flex: 1;
      padding: 2rem 1.75rem 6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      border-top-left-radius: 80px 60px;
      border-top-right-radius: 80px 60px;
      border-bottom-right-radius: 100px 200px;
      position: relative;
      z-index: 2;
      margin-top: 1rem;
    }

    /* Headline inside blue area */
    .left-panel .pay-block {
      margin: 0 0 1.5rem;
      text-align: center;
    }

    .left-panel .pay-label {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.3;
      margin-bottom: 0.75rem;
    }

    .left-panel .pay-amount {
      font-size: 2.5rem;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.5px;
      color: #39d353;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      white-space: nowrap;
    }

    .left-panel .left-bottom-text {
      font-size: 1.1rem;
      line-height: 1.4;
      font-weight: 600;
      color: #ffffff;
      opacity: 0.95;
      max-width: 240px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      padding-top: 1.5rem;
      margin-top: 1.5rem;
    }

    /* ---------- RIGHT PANEL ---------- */
    .right-panel {
      flex: 1;
      padding: 2.5rem 2.5rem 2.5rem 1.5rem;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .right-panel h1 {
      font-size: 2.3rem;
      font-weight: 800;
      color: #112233;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .right-panel .subtitle {
      font-size: 1.15rem;
      color: #4b5e71;
      margin-bottom: 1.5rem;
      font-weight: 400;
      line-height: 1.4;
    }

    /* ---------- FORM (from index3) ---------- */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 25px;
      
      margin-top: 65px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group select {
      padding: 14px 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      color: #333;
      background-color: #f9f9f9;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      width: 100%;
      font-family: inherit;
    }

    .form-group input::placeholder {
      color: #999;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #3b7cbf;
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(59, 124, 191, 0.1);
    }

    /* Button – same as index1/index2 */
    .btn-submit {
      font-size: 1.3rem;
      font-weight: 600;
      padding: 1rem 2rem;
      border-radius: 50px;
      border: none;
      background-color: #3b7cbf;
      color: #ffffff;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 10px rgba(59, 124, 191, 0.2);
      letter-spacing: 0.3px;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 0.5rem;
      text-decoration: none;
    }

    .btn-submit:hover {
      background-color: #2b5f94;
      box-shadow: 0 6px 14px rgba(43, 95, 148, 0.3);
    }

    .btn-submit:focus-visible {
      outline: 4px solid #1e2b3c;
      outline-offset: 4px;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 820px) {
      .main-card {
        flex-direction: column;
        border-radius: 28px;
        max-width: 700px;
        min-height: auto;
      }

      .left-panel {
        width: 100%;
        min-width: unset;
      }

      .left-panel .brand-block {
        padding: 30px;
      }

      .left-panel .brand-logo {
        width: min(100%, 300px);
        max-height: 120px;
      }

      .left-panel .blue-panel {
        border-top-left-radius: 60px 40px;
        border-top-right-radius: 60px 40px;
        border-bottom-right-radius: 80px 60%;
        border-bottom-left-radius: 80px 60%;
        padding: 2rem 1.5rem 3rem;
        flex: none;
        margin-top: 0;
      }

      .left-panel .left-bottom-text {
        border-top: none;
        padding-top: 0.5rem;
        font-size: 1rem;
        max-width: 100%;
      }

      .right-panel {
        padding: 2rem 1.5rem 2rem;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .form-group.full-width {
        grid-column: span 1;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0.75rem;
      }

      .main-card {
        border-radius: 24px;
      }

      .left-panel .brand-block {
        padding: 20px;
      }

      .left-panel .brand-logo {
        width: min(100%, 240px);
        max-height: 100px;
      }

      .left-panel .blue-panel {
        padding: 1.5rem 1rem 2.5rem;
        border-top-left-radius: 40px 30px;
        border-top-right-radius: 40px 30px;
        border-bottom-right-radius: 60px 40%;
        border-bottom-left-radius: 60px 40%;
      }

      .left-panel .pay-amount {
        font-size: 2.15rem;
      }

      .right-panel {
        padding: 1.5rem 1rem 1.75rem;
      }

      .right-panel h1 {
        font-size: 1.9rem;
      }

      .right-panel .subtitle {
        font-size: 1.05rem;
      }

      .btn-submit {
        font-size: 1.2rem;
        padding: 0.9rem 1.5rem;
        min-height: 60px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="main-card" id="mainCard">

    <!-- LEFT PANEL -->
    <div class="left-panel">

      <!-- Logo at top on white background with 30px margin -->
      <div class="brand-block">
        <img
          class="brand-logo"
          src="images\ChatGPT Image Oct 7, 2026, 01_00_04 PM.png"
          alt="Family Caregiver Staffing logo"
        >
      </div>

      <!-- Blue curved panel starts right under the logo -->
      <div class="blue-panel">
        <div class="pay-block">
          <div class="pay-label"><h2>Caregiver Information</h2></div>
         
        </div>

        <div class="left-bottom-text">
          We recruit the people<br>who are already providing<br>the care.
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel" id="rightPanel">

      <!-- HEADING from index2.html -->
      <h2>Become a Paid Family Caregiver</h2>
      <p class="subtitle">Already caring for a loved one?</p>

      <!-- FORM SECTION (Form stays the same as index3.html) -->
      <form id="caregiverInfoForm">
        <div class="form-grid">
          <!-- First Name -->
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Enter first name" required>
          </div>

          <!-- Last Name -->
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Enter last name" required>
          </div>

          <!-- Phone Number -->
          <div class="form-group">
            <label for="phone">Phone #</label>
            <input type="tel" id="phone" name="phone" placeholder="(555) 000-0000" required>
          </div>

          <!-- Email Address -->
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>

          <!-- Who do you provide care for? (Full Width) -->
          <div class="form-group full-width">
            <label for="careRecipient">Who do you provide care for?</label>
            <select id="careRecipient" name="careRecipient" required>
              <option value="" disabled selected>Select an option</option>
              <option value="father">My Father</option>
              <option value="mother">My Mother</option>
              <option value="grandfather">My Grandfather</option>
              <option value="grandmother">My Grandmother</option>
              <option value="mother-in-law">My Mother-in-law</option>
              <option value="father-in-law">My Father-in-law</option>
              <option value="husband">My Husband</option>
              <option value="wife">My Wife</option>
              <option value="son">My Son</option>
              <option value="daughter">My Daughter</option>
              <option value="brother">My Brother</option>
              <option value="sister">My Sister</option>
              <option value="male-relative">My Male Relative</option>
              <option value="female-relative">My Female Relative</option>
              <option value="female-partner">My Female Partner</option>
              <option value="male-partner">My Male Partner</option>
              <option value="male-neighbor">My Male Neighbor</option>
              <option value="female-neighbor">My Female Neighbor</option>
            </select>
          </div>
        </div>

        <!-- Submit Button -->
        <a href="index3.html" class="btn-submit">Next &rarr;</a>
      </form>

    </div><!-- /right-panel -->
  </div><!-- /main-card -->

</body>
</html>
